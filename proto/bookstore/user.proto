syntax = "proto3";

package bookstore.user.v1;

option go_package = "bookstore-microservices/proto/bookstore;bookstorepb";

import "bookstore/common.proto";

service UserService {
  rpc Health(bookstore.common.v1.HealthCheckRequest) returns (bookstore.common.v1.HealthCheckResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
}
