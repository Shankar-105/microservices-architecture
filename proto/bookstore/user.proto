syntax = "proto3";

package bookstore.user.v1;

option go_package = "microservices/generated-go/bookstore;bookstorepb";

import "bookstore/common.proto";

service UserService {
  rpc Health(bookstore.common.v1.HealthCheckRequest) returns (bookstore.common.v1.HealthCheckResponse);
  // Resolves a stable user identifier or returns NOT_FOUND.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest {
  // Stable user identifier; 1-128 visible characters.
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
}
