syntax = "proto3";

package bookstore.catalog.v1;

option go_package = "microservices/generated-go/bookstore;bookstorepb";

import "bookstore/common.proto";

service CatalogService {
  rpc Health(bookstore.common.v1.HealthCheckRequest) returns (bookstore.common.v1.HealthCheckResponse);
  rpc GetBook(GetBookRequest) returns (GetBookResponse);
}

message GetBookRequest {
  string book_id = 1;
}

message GetBookResponse {
  string book_id = 1;
  string title = 2;
  int64 price_cents = 3;
  bool available = 4;
}
