syntax = "proto3";

package bookstore.payment.v1;

option go_package = "microservices/generated-go/bookstore;bookstorepb";

import "bookstore/common.proto";

service PaymentService {
  rpc Health(bookstore.common.v1.HealthCheckRequest) returns (bookstore.common.v1.HealthCheckResponse);
  rpc Authorize(AuthorizePaymentRequest) returns (AuthorizePaymentResponse);
}

message AuthorizePaymentRequest {
  string order_id = 1;
  int64 amount_cents = 2;
}

message AuthorizePaymentResponse {
  bool approved = 1;
  string transaction_id = 2;
  string reason = 3;
}
