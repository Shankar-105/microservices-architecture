services:
  gateway-go:
    build:
      context: .
      dockerfile: gateway-go/Dockerfile
    environment:
      ORDER_SERVICE_ADDR: order-service-go:50052
      CATALOG_SERVICE_ADDR: catalog-service-py:50053
    depends_on:
      order-service-go:
        condition: service_started
      catalog-service-py:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  user-service-go:
    build:
      context: .
      dockerfile: user-service-go/Dockerfile
    ports:
      - "50051:50051"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 3s
      retries: 3

  order-service-go:
    build:
      context: .
      dockerfile: order-service-go/Dockerfile
    environment:
      USER_SERVICE_ADDR: user-service-go:50051
      CATALOG_SERVICE_ADDR: catalog-service-py:50053
    depends_on:
      user-service-go:
        condition: service_started
      catalog-service-py:
        condition: service_healthy
    ports:
      - "50052:50052"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 3s
      retries: 3

  catalog-service-py:
    build:
      context: .
      dockerfile: catalog-service-py/Dockerfile
    ports:
      - "50053:50053"
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
